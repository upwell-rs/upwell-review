[package]
name = "upwell-review"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Independent two-stage pull request review for upwell-rs/upwell through local model CLIs"
repository = "https://github.com/upwell-rs/upwell-review"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[workspace]
